[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# test/ROYALNFTv1Baseline.t.sol compiles the untouched V1 contract at the repo root.
allow_paths = [".."]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
